<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Карп в пруду</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&display=swap">
<style>
:root{
  box-sizing:border-box;
  --page:#d9ccf7; --ink:#111111; --muted:#5d5675; --water:#111111; --accent:#ffd60a; --on-accent:#111111;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--page:#120d1f;--ink:#ffffff;--muted:#b4a9d6;--water:#3a2a70;}
}
:root[data-theme="dark"]{--page:#120d1f;--ink:#ffffff;--muted:#b4a9d6;--water:#3a2a70;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--page);color:var(--ink);font-family:"Unbounded",system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
h1{font-size:clamp(20px,5vw,28px);margin:0;font-weight:700}
.bar{display:flex;align-items:center;gap:24px;font-size:14px;color:var(--muted)}
.bar b{color:var(--ink);font-weight:700}
.wrap{position:relative;line-height:0}
canvas{border-radius:18px;background:var(--water);touch-action:none;display:block;max-width:100%}
.over{position:absolute;inset:0;border-radius:18px;background:rgba(17,17,17,.85);color:#ffffff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px;line-height:1.4}
.over p{margin:0;font-size:15px}
.over .big{font-size:22px;font-weight:700}
button{font:inherit;font-weight:700;font-size:15px;background:var(--accent);color:var(--on-accent);border:0;border-radius:999px;padding:12px 28px;cursor:pointer}
button:focus-visible{outline:3px solid #f3e9d2;outline-offset:3px}
.hint{font-size:12px;color:var(--muted);margin:0;text-align:center;max-width:360px;line-height:1.5}
.dp{display:grid;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(2,56px);gap:8px;user-select:none;-webkit-user-select:none}
.dp button{padding:0;border-radius:16px;font-size:20px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.dp button:active{transform:scale(.94)}
.dp [data-d=u]{grid-column:2;grid-row:1}
.dp [data-d=l]{grid-column:1;grid-row:2}
.dp [data-d=d]{grid-column:2;grid-row:2}
.dp [data-d=r]{grid-column:3;grid-row:2}
.pz{padding:6px 14px;font-size:12px;touch-action:manipulation}
.hidden{display:none}
</style>
</head>
<body>
<h1 id="h1">Карп в пруду</h1>
<div class="bar"><span><span id="lScore">Счёт</span>: <b id="score">0</b></span><span><span id="lBest">Рекорд</span>: <b id="best">0</b></span><button class="pz" id="pz" aria-label="Пауза">&#10074;&#10074;</button></div>
<div class="wrap">
  <canvas id="c" width="468" height="468" aria-label="Игровое поле"></canvas>
  <div class="over" id="over">
    <p class="big" id="title">Накорми карпа</p>
    <p id="msg">Собирай кувшинки и не врезайся в стены и в свой хвост.</p>
    <button id="go">Играть</button>
  </div>
</div>
<div class="dp hidden" id="dp"><button data-d="u">&#9650;</button><button data-d="l">&#9664;&#xFE0E;</button><button data-d="d">&#9660;</button><button data-d="r">&#9654;&#xFE0E;</button></div>
<p class="hint" id="hint"></p>

<script>
(function(){
  var N = 18, cv = document.getElementById('c'), ctx = cv.getContext('2d');
  var overEl = document.getElementById('over'), titleEl = document.getElementById('title'),
      msgEl = document.getElementById('msg'), goBtn = document.getElementById('go'),
      scoreEl = document.getElementById('score'), bestEl = document.getElementById('best');
  var CELL = 26, timer = null, fish, dir, queue, pad, score, best = 0, state = 'ready', tick = 0;

  var touch = (window.matchMedia && matchMedia('(pointer:coarse)').matches) || 'ontouchstart' in window;
  var lang = 'en'; try { lang = localStorage.getItem('hub-lang') || (/^ru/i.test(navigator.language || '') ? 'ru' : 'en'); } catch (e) {}
  if (lang !== 'ru') lang = 'en';
  var T = {
    ru: {title:'Карп в пруду',score:'Счёт',best:'Рекорд',field:'Игровое поле',ready:'Накорми карпа',readyMsg:'Собирай кувшинки и не врезайся в стены и в свой хвост.',
      play:'Играть',again:'Ещё раз',resume:'Продолжить',paused:'Пауза',pausedMsg:'Нажми пробел или кнопку, чтобы продолжить.',pausedMsgTouch:'Нажми кнопку, чтобы продолжить.',
      record:'Новый рекорд: ',eaten:'Съедено кувшинок: ',crash:'Карп врезался. ',coinsW:'монет',xpW:'опыта',notSaved:'Прогресс не сохранён.',retry:'Ещё раз?',
      hintPc:'Стрелки или WASD на клавиатуре. Пробел — пауза.',hintTouch:'Свайпай по полю или жми на стрелки.',
      up:'Вверх',down:'Вниз',left:'Влево',right:'Вправо'},
    en: {title:'Koi Pond',score:'Score',best:'Best',field:'Game field',ready:'Feed the koi',readyMsg:'Collect lily pads and avoid the walls and your own tail.',
      play:'Play',again:'Play again',resume:'Resume',paused:'Paused',pausedMsg:'Press Space or the button to resume.',pausedMsgTouch:'Tap the button to resume.',
      record:'New record: ',eaten:'Lily pads eaten: ',crash:'The koi crashed. ',coinsW:'coins',xpW:'XP',notSaved:'Progress not saved.',retry:'Try again?',
      hintPc:'Arrow keys or WASD. Space to pause.',hintTouch:'Swipe on the field or use the arrow buttons.',
      up:'Up',down:'Down',left:'Left',right:'Right'}
  };
  function t(k){ return T[lang][k]; }
  var DIRS = {u:[0,-1], d:[0,1], l:[-1,0], r:[1,0]};
  var dp = document.getElementById('dp'), pzBtn = document.getElementById('pz');
  function applyLang(){
    document.documentElement.lang = lang; document.title = t('title');
    document.getElementById('h1').textContent = t('title');
    document.getElementById('lScore').textContent = t('score'); document.getElementById('lBest').textContent = t('best');
    cv.setAttribute('aria-label', t('field')); pzBtn.setAttribute('aria-label', t('paused'));
    document.getElementById('hint').textContent = touch ? t('hintTouch') : t('hintPc');
    [].forEach.call(dp.querySelectorAll('button'), function(b){ b.setAttribute('aria-label', t({u:'up',d:'down',l:'left',r:'right'}[b.getAttribute('data-d')])); });
    dp.classList.toggle('hidden', !touch);
    if (state === 'ready'){ titleEl.textContent = t('ready'); msgEl.textContent = t('readyMsg'); goBtn.textContent = t('play'); }
  }
  try { best = parseInt(localStorage.getItem('koi-best') || '0', 10) || 0; } catch (e) {}
  bestEl.textContent = best;

  function resize(){
    var side = Math.min(window.innerWidth - 32, window.innerHeight - 220 - (touch ? 134 : 0), 468);
    side = Math.max(240, Math.floor(side / N) * N);
    cv.width = cv.height = side; CELL = side / N;
    cv.style.width = cv.style.height = side + 'px';
    draw();
  }

  function reset(){
    fish = [{x:9,y:9},{x:8,y:9},{x:7,y:9}];
    dir = {x:1,y:0}; queue = []; score = 0; tick = 0;
    scoreEl.textContent = 0; placePad();
  }

  function placePad(){
    var ok = false;
    while(!ok){
      pad = {x:Math.floor(Math.random()*N), y:Math.floor(Math.random()*N)};
      ok = !fish.some(function(s){return s.x===pad.x && s.y===pad.y;});
    }
  }

  function setDir(dx, dy){
    var last = queue.length ? queue[queue.length-1] : dir;
    if (dx === -last.x && dy === -last.y) return;
    if (dx === last.x && dy === last.y) return;
    if (queue.length < 3) queue.push({x:dx,y:dy});
  }

  function step(){
    if (queue.length) dir = queue.shift();
    var h = {x:fish[0].x + dir.x, y:fish[0].y + dir.y};
    var hitWall = h.x<0 || h.y<0 || h.x>=N || h.y>=N;
    var hitSelf = fish.some(function(s,i){return i < fish.length-1 && s.x===h.x && s.y===h.y;});
    if (hitWall || hitSelf) return end();
    fish.unshift(h);
    if (h.x===pad.x && h.y===pad.y){
      score++; scoreEl.textContent = score; placePad();
      if (score % 4 === 0) run();
    } else fish.pop();
    tick++; draw();
  }

  function speed(){ return Math.max(70, 140 - score*3); }
  function run(){ clearInterval(timer); timer = setInterval(step, speed()); }

  function start(){
    reset(); state = 'playing'; overEl.classList.add('hidden'); run(); draw();
    goBtn.blur();
  }

  function end(){
    clearInterval(timer); state = 'over';
    var rec = score > best;
    if (rec){ best = score; bestEl.textContent = best; try { localStorage.setItem('koi-best', String(best)); } catch (e) {} }
    var saved = false;
    try {
      var c = parseInt(localStorage.getItem('hub-coins') || '0', 10) || 0,
          f = parseInt(localStorage.getItem('hub-fruits') || '0', 10) || 0;
      localStorage.setItem('hub-coins', String(c + score));
      localStorage.setItem('hub-fruits', String(f + score));
      saved = true;
    } catch (e) {}
    titleEl.textContent = rec && score > 0 ? t('record') + score : t('eaten') + score;
    msgEl.textContent = t('crash') + (saved ? '+' + score + ' ' + t('coinsW') + ', +' + (score / 10).toFixed(1) + ' ' + t('xpW') + '. ' : t('notSaved') + ' ') + t('retry');
    goBtn.textContent = t('again');
    overEl.classList.remove('hidden'); draw();
  }

  function pause(){
    if (state === 'playing'){ clearInterval(timer); state = 'paused';
      titleEl.textContent = t('paused'); msgEl.textContent = touch ? t('pausedMsgTouch') : t('pausedMsg');
      goBtn.textContent = t('resume'); overEl.classList.remove('hidden'); }
    else if (state === 'paused'){ state = 'playing'; overEl.classList.add('hidden'); run(); }
  }

  function draw(){
    var w = cv.width, c = CELL, i, s;
    ctx.clearRect(0,0,w,w);
    ctx.fillStyle = 'rgba(255,255,255,.035)';
    for (i=0;i<N;i++) for (var j=0;j<N;j++) if ((i+j)%2===0) ctx.fillRect(i*c,j*c,c,c);
    if (!fish) return;
    // lily pad
    var px = pad.x*c + c/2, py = pad.y*c + c/2;
    ctx.fillStyle = '#c9b6f2'; ctx.beginPath(); ctx.arc(px,py,c*0.38,0.4,Math.PI*2-0.4); ctx.lineTo(px,py); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(px+c*0.05,py-c*0.05,c*0.13,0,Math.PI*2); ctx.fill();
    // fish body, tail to head
    for (i = fish.length-1; i >= 0; i--){
      s = fish[i];
      var t = 1 - (i / (fish.length+2)) * 0.45;
      var wob = Math.sin((tick - i) * 0.6) * c*0.04;
      ctx.fillStyle = (i % 3 === 1) ? '#ffffff' : '#ffd60a';
      ctx.beginPath(); ctx.arc(s.x*c + c/2 + wob*dir.y, s.y*c + c/2 + wob*dir.x, c*0.46*t, 0, Math.PI*2); ctx.fill();
    }
    // head details
    var h = fish[0], hx = h.x*c + c/2, hy = h.y*c + c/2, ox = -dir.y*c*0.2, oy = dir.x*c*0.2, fx = dir.x*c*0.15, fy = dir.y*c*0.15;
    ctx.fillStyle = '#111111';
    ctx.beginPath(); ctx.arc(hx+fx+ox, hy+fy+oy, c*0.08, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(hx+fx-ox, hy+fy-oy, c*0.08, 0, Math.PI*2); ctx.fill();
  }

  // input
  window.addEventListener('keydown', function(e){
    var k = e.key.toLowerCase(), m = {arrowup:[0,-1],w:[0,-1],'ц':[0,-1],arrowdown:[0,1],s:[0,1],'ы':[0,1],
      arrowleft:[-1,0],a:[-1,0],'ф':[-1,0],arrowright:[1,0],d:[1,0],'в':[1,0]};
    if (m[k]){ e.preventDefault(); if (state === 'ready' || state === 'over') return; setDir(m[k][0], m[k][1]); }
    else if (k === ' '){ e.preventDefault(); if (state === 'playing' || state === 'paused') pause(); }
  });
  var tx = 0, ty = 0;
  cv.addEventListener('touchstart', function(e){ tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
  cv.addEventListener('touchend', function(e){
    var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0); else setDir(0, dy > 0 ? 1 : -1);
  }, {passive:true});
  goBtn.addEventListener('click', function(){ if (state === 'paused') pause(); else start(); });
  window.addEventListener('resize', resize);
  pzBtn.addEventListener('click', function(){ pause(); this.blur(); });
  [].forEach.call(dp.querySelectorAll('button'), function(b){
    b.addEventListener('pointerdown', function(e){
      e.preventDefault();
      if (state !== 'playing') return;
      var d = DIRS[b.getAttribute('data-d')]; setDir(d[0], d[1]);
    });
  });

  reset(); applyLang(); resize();
})();
</script>
</body>
</html>
